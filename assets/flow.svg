<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"
     aria-label="Claude Code and Codex talk to notionmemory, which captures and recalls in your Notion">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/>
    </marker>
    <style>
      .lbl   { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .name  { font-weight: 700; fill: #191919; }
      .sub   { fill: #8b93a1; font-size: 13px; }
      .arrow { stroke: #8b93a1; stroke-width: 2.2; fill: none; }
      .cap   { fill: #6b7280; font-size: 13px; font-style: italic; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="16" fill="#ffffff" stroke="#e1e4e8"/>

  <!-- agents (left) -->
  <g>
    <rect x="40" y="52" width="182" height="78" rx="12" fill="#fbfbfb" stroke="#e1e4e8"/>
    <rect x="40" y="52" width="7" height="78" rx="3.5" fill="#d97757"/>
    <text class="lbl name" x="70" y="88" font-size="19">Claude Code</text>
    <text class="lbl sub"  x="70" y="110">coding agent</text>

    <rect x="40" y="170" width="182" height="78" rx="12" fill="#fbfbfb" stroke="#e1e4e8"/>
    <rect x="40" y="170" width="7" height="78" rx="3.5" fill="#10a37f"/>
    <text class="lbl name" x="70" y="206" font-size="19">Codex</text>
    <text class="lbl sub"  x="70" y="228">coding agent</text>
  </g>

  <!-- notionmemory (center) -->
  <rect x="360" y="112" width="180" height="76" rx="14" fill="#191919"/>
  <text class="lbl" x="450" y="150" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">notionmemory</text>
  <text class="lbl" x="450" y="172" font-size="12.5" fill="#9b9b9b" text-anchor="middle">skills + CLI</text>

  <!-- Notion (right, vertically centered on notionmemory) -->
  <g>
    <rect x="668" y="111" width="200" height="78" rx="12" fill="#fbfbfb" stroke="#e1e4e8"/>
    <rect x="686" y="129" width="42" height="42" rx="10" fill="#191919"/>
    <text x="707" y="160" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <text class="lbl name" x="740" y="145" font-size="18">Notion</text>
    <text class="lbl sub"  x="740" y="167">Second Brain</text>
  </g>

  <!-- Y junction: both agents merge into one trunk into notionmemory -->
  <path class="arrow" d="M226,91 C262,98 284,126 300,148" marker-start="url(#arrow)"/>
  <path class="arrow" d="M226,209 C262,202 284,174 300,152" marker-start="url(#arrow)"/>
  <path class="arrow" d="M300,150 L356,150" marker-end="url(#arrow)"/>
  <text class="lbl cap" x="258" y="144" text-anchor="middle">you ask</text>
  <text class="lbl cap" x="258" y="163" text-anchor="middle">it runs</text>

  <!-- arrows: notionmemory <-> Notion -->
  <path class="arrow" d="M544,140 C600,136 600,124 664,120" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="arrow" d="M544,160 C600,164 600,176 664,180" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl cap" x="604" y="122" text-anchor="middle">save</text>
  <text class="lbl cap" x="604" y="196" text-anchor="middle">recall</text>
</svg>
