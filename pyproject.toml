[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notionmemory"
version = "1.2.1"
description = "Notion as a second-brain hub for coding agents: memory, calendar, templates, and library skills."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0", "Flask>=3.0.0", "requests>=2.31.0", "keyring>=25"]
authors = [{name = "Jaewoo Jeon", email = "learnsteam.kr@gmail.com"}]
keywords = ["notion", "second-brain", "claude-code", "codex", "agent-memory", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/legojeon/notionmemory"
Repository = "https://github.com/legojeon/notionmemory"
Issues = "https://github.com/legojeon/notionmemory/issues"

[project.scripts]
notionmemory = "notionmemory.cli:main"

[tool.setuptools.packages.find]
include = ["notionmemory*"]
namespaces = false

[tool.setuptools.package-data]
# 런타임에 코드가 읽는 데이터는 전부 여기 있어야 wheel 에 들어간다. editable
# 설치(`pip install -e .`)는 소스 트리를 그대로 읽어서 이게 틀려도 안 터지므로,
# 빠뜨리면 `uv tool install .` / `pip install .` 사용자에게서만 조용히 깨진다.
# tests/test_packaging.py 와 scripts/verify_clean_clone.sh 가 함께 강제한다.
notionmemory = ["agent_skills/**/*"]
"notionmemory.web" = ["assets/*"]                 # web/server.py 가 정적 서빙

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "harness: 실제 Claude Code / Codex 세션이 필요하다 (구독 소모, 기본 제외)",
]
